# Cloudflare Pages configuration
name = "learninglab"
compatibility_date = "2026-01-01"

[build]
command = "npm run build:client"
publish = "server/client/dist"

[env.production.vars]
NODE_ENV = "production"

# Environment variables and bindings are managed in the Cloudflare Pages Dashboard
# Go to: Cloudflare Pages → LearningLab → Settings → Environment Variables / Bindings
# Required variables:
# - OPENAI_API_KEY: Your OpenAI API key (starts with sk-proj-...)
# Optional variables:
# - ALLOWED_ORIGINS: comma-separated extra origins allowed to call /api/*
#   (same-origin requests are always allowed)
# - RATE_LIMIT_FAIL_OPEN: set to "true" to allow requests when RATE_LIMIT_KV
#   is missing/unavailable (default: refuse with 503 so a misconfigured
#   deployment cannot run unmetered against the OpenAI account)
# Required bindings:
# - KV namespace `RATE_LIMIT_KV`: per-IP rate limiting of
#   /api/generate-worksheet (10 requests / hour, mirrors the Express server).
#   KV is eventually consistent, so also add a WAF rate-limiting rule on
#   /api/* for a hard edge limit.
#
# For local testing with `wrangler pages dev`, uncomment:
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "<namespace id>"
